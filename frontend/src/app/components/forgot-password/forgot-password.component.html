<div class="forgot-password-container">
  <div class="forgot-password-card">
    <div class="forgot-password-header">
      <h1>Recuperar Senha</h1>
      <p>Digite seu e-mail para receber o link de recuperação</p>
    </div>

    <div *ngIf="error" class="error-alert">
      {{ error }}
    </div>

    <div *ngIf="success" class="success-alert">
      E-mail enviado com sucesso! Verifique sua caixa de entrada.
    </div>

    <form (ngSubmit)="onSubmit()" class="forgot-password-form">
      <div class="form-group">
        <label for="email">E-mail *</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Digite seu e-mail"
          required
          [disabled]="loading"
        />
        <div *ngIf="submitted && !email" class="error-message">
          E-mail é obrigatório
        </div>
        <div *ngIf="submitted && email && !isValidEmail(email)" class="error-message">
          E-mail inválido
        </div>
      </div>

      <button 
        type="submit" 
        class="recover-btn" 
        [disabled]="loading"
      >
        <span *ngIf="loading" class="loading-spinner"></span>
        {{ loading ? 'Enviando...' : 'Enviar Link de Recuperação' }}
      </button>

      <div class="back-to-login-container">
        <a routerLink="/login" class="back-to-login-link">
          Voltar para o login
        </a>
      </div>
    </form>
  </div>
</div>
