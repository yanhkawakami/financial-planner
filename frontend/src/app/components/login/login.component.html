<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>Financial Planner</h1>
      <p>Faça login para acessar o sistema</p>
    </div>

    <div *ngIf="error" class="error-alert">
      {{ error }}
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Usuário (E-mail) *</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="credentials.username"
          placeholder="Digite seu usuário"
          required
          [disabled]="loading"
        />
        <div *ngIf="submitted && !credentials.username" class="error-message">
          Usuário é obrigatório
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha *</label>
        <div class="password-input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="credentials.password"
            placeholder="Digite sua senha"
            required
            [disabled]="loading"
          />
          <button 
            type="button" 
            class="toggle-password-btn" 
            (click)="togglePasswordVisibility()"
            tabindex="-1"
          >
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div *ngIf="submitted && !credentials.password" class="error-message">
          Senha é obrigatória
        </div>
      </div>

      <button 
        type="submit" 
        class="login-btn" 
        [disabled]="loading"
      >
        <span *ngIf="loading" class="loading-spinner"></span>
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>

      <div class="forgot-password-container">
        <a routerLink="/forgot-password" class="forgot-password-link">
          Esqueci minha senha
        </a>
      </div>

      <div class="signup-container">
        <p class="signup-text">Não tem uma conta?</p>
        <a routerLink="/signup" class="signup-link">
          Criar conta
        </a>
      </div>
    </form>
  </div>
</div>
