<div class="reset-password-container">
  <div class="reset-password-card">
    <div class="reset-password-header">
      <h1>Nova Senha</h1>
      <p>Digite sua nova senha</p>
    </div>

    <div *ngIf="error" class="error-alert">
      {{ error }}
    </div>

    <div *ngIf="success" class="success-alert">
      Senha redefinida com sucesso! Redirecionando para o login...
    </div>

    <form (ngSubmit)="onSubmit()" class="reset-password-form" *ngIf="!success">
      <div class="form-group">
        <label for="password">Nova Senha *</label>
        <div class="password-input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="password"
            placeholder="Digite sua nova senha"
            required
            [disabled]="loading"
          />
          <button 
            type="button" 
            class="toggle-password-btn" 
            (click)="togglePasswordVisibility()"
            tabindex="-1"
          >
            {{ showPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div *ngIf="submitted && !password" class="error-message">
          Senha é obrigatória
        </div>
        <div *ngIf="submitted && password && password.length < 6" class="error-message">
          A senha deve ter no mínimo 6 caracteres
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmar Senha *</label>
        <div class="password-input-container">
          <input
            [type]="showConfirmPassword ? 'text' : 'password'"
            id="confirmPassword"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Confirme sua nova senha"
            required
            [disabled]="loading"
          />
          <button 
            type="button" 
            class="toggle-password-btn" 
            (click)="toggleConfirmPasswordVisibility()"
            tabindex="-1"
          >
            {{ showConfirmPassword ? '👁️' : '👁️‍🗨️' }}
          </button>
        </div>
        <div *ngIf="submitted && !confirmPassword" class="error-message">
          Confirmação de senha é obrigatória
        </div>
        <div *ngIf="submitted && confirmPassword && !passwordsMatch()" class="error-message">
          As senhas não coincidem
        </div>
      </div>

      <button 
        type="submit" 
        class="reset-btn" 
        [disabled]="loading || !token"
      >
        <span *ngIf="loading" class="loading-spinner"></span>
        {{ loading ? 'Salvando...' : 'Redefinir Senha' }}
      </button>

      <div class="back-to-login-container">
        <a routerLink="/login" class="back-to-login-link">
          Voltar para o login
        </a>
      </div>
    </form>
  </div>
</div>
